services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Consola web (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: .
    environment:
      RABBITMQ_HOST: rabbitmq
      API_SECRET_KEY: ${API_SECRET_KEY:-telecom-ep3-secret-2026}
      RATE_LIMIT: ${RATE_LIMIT:-30/minute}
      USE_SAGEMAKER: ${USE_SAGEMAKER:-false}
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "src.api.worker"]
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_URL: http://api:8000
      API_SECRET_KEY: ${API_SECRET_KEY:-telecom-ep3-secret-2026}
    ports:
      - "8501:8501"
    depends_on:
      - api